<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dégradés -->
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fond carré avec bordure arrondie -->
  <rect x="0" y="0" width="512" height="512" rx="80" fill="#f8fafc" />

  <!-- Grand A pour Alt -->
  <text x="140" y="380" font-family="Arial, sans-serif" font-size="320" font-weight="bold" fill="url(#primaryGradient)">A</text>

  <!-- Éléments du logo -->
  <g transform="translate(280, 180)">
    <!-- Document stylisé -->
    <rect x="0" y="0" width="120" height="160" rx="12" fill="white" stroke="#64748b" stroke-width="6" />

    <!-- Graphique de progression croissante -->
    <polyline points="15,110 35,90 60,100 85,70 105,50" stroke="url(#primaryGradient)" stroke-width="10" fill="none" stroke-linecap="round" />

    <!-- Coche dans un cercle -->
    <circle cx="50" cy="50" r="30" fill="url(#accentGradient)" />
    <path d="M35 50 L45 60 L65 35" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>